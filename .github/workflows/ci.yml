name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Lint, unit tests, coverage gate, debug and minified release APKs
        run: ./gradlew ktlintCheck lint testDebugUnitTest :core:domain:test :core:domain:koverVerify assembleDebug :app:assembleRelease -Pcadence.signWithDebugKey=true --continue

      - name: APKs request no network permissions
        run: |
          scripts/check-apk-permissions.sh app/build/outputs/apk/debug/app-debug.apk
          scripts/check-apk-permissions.sh app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cadence-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

  instrumented:
    name: Device tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (Android 8.0) and current target (Android 16).
        api-level: [26, 36]
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space for the emulator
        # The emulator needs several GB for its data partition; drop toolchains this build never uses.
        # Runs before setup-java, because it clears the tool cache that Java is installed into.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/android/sdk/ndk "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs and a minified release APK
        # The release APK is signed with the debug key, just so it can be installed for the smoke test.
        run: ./gradlew :core:data:assembleDebugAndroidTest :feature:backup:assembleDebugAndroidTest :app:assembleDebugAndroidTest :app:assembleRelease -Pcadence.signWithDebugKey=true

      - name: Run device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 2048M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew :core:data:connectedDebugAndroidTest :feature:backup:connectedDebugAndroidTest :app:connectedDebugAndroidTest
            scripts/smoke-test-release.sh app/build/outputs/apk/release/app-release.apk

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports-api-${{ matrix.api-level }}
          path: '**/build/reports/androidTests/'
